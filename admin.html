<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório - Tesouraria</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
 body{background:#f1f5f9}
 .card{max-width:900px;margin:20px auto}
 #telaBloqueio{position:fixed;top:0;left:0;width:100%;height:100%;background:#f1f5f9;z-index:9999;display:flex;justify-content:center;align-items:center;padding:20px}
</style>
</head>
<body>

<div id="telaBloqueio">
<div class="card shadow p-4" style="max-width:400px;width:100%">
<h4 class="text-center">🔒 Acesso Restrito</h4>
<p class="text-center text-muted">Tesouraria IBJI</p>
<label>Digite a senha</label>
<input type="password" id="inputSenha" class="form-control mb-3" placeholder="Senha" onkeydown="if(event.key==='Enter') checarSenha()">
<button class="btn btn-primary w-100" onclick="checarSenha()">Entrar</button>
<p id="erroSenha" class="text-danger text-center mt-2"></p>
<button class="btn btn-outline-secondary w-100 mt-2" onclick="voltar()">Voltar para Lançamento</button>
</div>
</div>

<div class="container" id="conteudoRelatorio" style="display:none">
<div class="card shadow p-4">
<h3 class="text-center">Relatório Financeiro</h3>
<div class="row align-items-end mt-3">
<div class="col-5"><select id="selectMes" class="form-select"></select></div>
<div class="col-3"><button class="btn btn-outline-primary w-100" onclick="carregar()">🔄 Atualizar</button></div>
<div class="col-4 text-end">
<button class="btn btn-warning me-1" onclick="sair()">Sair</button>
<button class="btn btn-secondary" onclick="voltar()">Voltar</button>
</div>
</div>
<div class="alert alert-info mt-3" id="resumo"></div>
<div class="table-responsive">
<table class="table table-bordered table-striped">
<thead class="table-light"><tr><th>Data</th><th>Nome</th><th>Tipo</th><th>Valor</th><th>Pagamento</th><th>Culto</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
<div class="d-flex gap-2">
<button class="btn btn-success" onclick="baixarExcel()">Baixar Excel do Mês</button>
<button class="btn btn-danger" onclick="apagarMes()">Apagar Só Este Mês</button>
</div>
</div>
</div>

<script>
const SENHA_CORRETA = "24M@ri28Juli";

// FORÇA SEMPRE PEDIR SENHA NA ENTRADA
sessionStorage.clear();

function checarSenha(){
  if(document.getElementById('inputSenha').value === SENHA_CORRETA){
    sessionStorage.setItem('logado','true');
    document.getElementById('telaBloqueio').style.display='none';
    document.getElementById('conteudoRelatorio').style.display='block';
    carregarMeses();
  } else {
    document.getElementById('erroSenha').textContent='❌ Senha incorreta!';
  }
}
function voltar(){
  sessionStorage.clear();
  localStorage.removeItem('logado');
  window.location.href='../index.html';
}
function sair(){
  sessionStorage.clear();
  localStorage.removeItem('logado');
  document.getElementById('inputSenha').value='';
  document.getElementById('conteudoRelatorio').style.display='none';
  document.getElementById('telaBloqueio').style.display='flex';
  document.getElementById('erroSenha').textContent='';
}

async function buscarDoServidor(){
  try{
    const r = await fetch('/.netlify/functions/listar');
    if(!r.ok) throw new Error();
    return await r.json();
  }catch(e){
    return JSON.parse(localStorage.getItem('ibji_pc')||'[]');
  }
}

let cacheTodos = [];
async function carregarMeses(){
  cacheTodos = await buscarDoServidor();
  if(cacheTodos.length===0){
    document.getElementById('selectMes').innerHTML='<option>Nenhum mês ainda</option>';
    document.getElementById('resumo').textContent='Nenhum dado salvo ainda.'; return;
  }
  let meses = [...new Set(cacheTodos.map(d=>d.mes || (d.data||'').substring(0,7)))].sort().reverse();
  document.getElementById('selectMes').innerHTML = meses.map(m=>`<option value="${m}">${m}</option>`).join('');
  carregar();
}
function carregar(){
  let mes = document.getElementById('selectMes').value;
  let todos = cacheTodos.filter(d=> (d.mes || (d.data||'').substring(0,7)) === mes);
  let total = todos.reduce((s,d)=> s + Number((d.valor+'').replace(',','.')||0), 0);
  let totalDizimo = todos.filter(d=> (d.tipo||'').toLowerCase().includes('dizimo')).reduce((s,d)=> s + Number((d.valor+'').replace(',','.')||0), 0);
  let totalOferta = total - totalDizimo;
  document.getElementById('resumo').innerHTML = `Mês: <b>${mes}</b> | ${todos.length} lanç. | Dízimos: R$ ${totalDizimo.toLocaleString('pt-BR',{minimumFractionDigits:2})} | Ofertas: R$ ${totalOferta.toLocaleString('pt-BR',{minimumFractionDigits:2})} | <b>Total: R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}</b>`;
  document.getElementById('tbody').innerHTML = todos.map(d=>`<tr><td>${(d.data||'').split('-').reverse().join('/')}</td><td>${d.nome||''}</td><td>${d.tipo||''}</td><td>R$ ${d.valorFormatado||d.valor||'0'}</td><td>${d.pagamento||''}</td><td>${d.culto||''}</td></tr>`).join('');
}
function baixarExcel(){
  let mes = document.getElementById('selectMes').value;
  let dados = cacheTodos.filter(d=> (d.mes || (d.data||'').substring(0,7)) === mes);
  let csv="Data;Nome;Tipo;Valor;Pagamento;Culto;Observacao\n";
  dados.forEach(d=> csv+=`${d.data};${d.nome};${d.tipo};${d.valorFormatado||d.valor};${d.pagamento};${d.culto};${(d.observacao||'').replace(/;/g,',')}\n`);
  let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})); a.download=`IBJI-${mes}.csv`; a.click();
}
async function apagarMes(){
  let mes = document.getElementById('selectMes').value;
  if(!confirm(`Apagar ${mes}?`)) return;
  await fetch('/.netlify/functions/apagar-mes', {method:'POST', body: JSON.stringify({mes})});
  carregarMeses();
}
document.getElementById('selectMes').addEventListener('change', carregar);
</script>
</body>
</html>
