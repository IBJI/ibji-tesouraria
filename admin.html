<!DOCTYPE html> <!-- Define que o documento é HTML5 -->
<html lang="pt-br"> <!-- Início do HTML em português do Brasil -->
<head> <!-- Início do cabeçalho -->
<meta charset="UTF-8"> <!-- Permite acentos e ç -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Deixa responsivo no celular -->
<title>Relatório - Tesouraria</title> <!-- Título da aba -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Importa Bootstrap -->
<style> /* Início do CSS */
 body{background:#f1f5f9} /* Cor de fundo cinza claro */
 #telaBloqueio{ /* Estilo da tela de senha */
    position:fixed; /* Fixa na tela toda */
    top:0; /* No topo */
    left:0; /* Na esquerda */
    width:100%; /* Largura total */
    height:100%; /* Altura total */
    background:#f1f5f9; /* Fundo cinza */
    z-index:9999; /* Fica por cima de tudo */
    display:flex; /* Usa flex para centralizar */
    justify-content:center; /* Centraliza na horizontal */
    align-items:center; /* Centraliza na vertical */
    padding:20px /* Espaço interno */
 }
</style> <!-- Fim do CSS -->
</head> <!-- Fim do cabeçalho -->
<body style="background:#f1f5f9"> <!-- Corpo da página com fundo cinza -->

<!-- TELA DE BLOQUEIO COM SENHA -->
<div id="telaBloqueio"> <!-- Div da tela de bloqueio -->
<div class="card shadow p-4" style="max-width:400px;width:100%"> <!-- Cartão branco do login -->
<h4 class="text-center">🔒 Acesso Restrito</h4> <!-- Título -->
<p class="text-center text-muted">Tesouraria IBJI</p> <!-- Subtítulo -->
<label>Digite a senha</label> <!-- Rótulo senha -->
<input type="password" id="inputSenha" class="form-control mb-3" placeholder="Senha" onkeydown="if(event.key==='Enter') checarSenha()"> <!-- Campo senha, Enter chama checarSenha -->
<button class="btn btn-primary w-100" onclick="checarSenha()">Entrar</button> <!-- Botão entrar -->
<p id="erroSenha" class="text-danger text-center mt-2"></p> <!-- Local da mensagem de erro -->
<button class="btn btn-outline-secondary w-100 mt-2" onclick="voltar()">Voltar para Lançamento</button> <!-- Botão voltar -->
</div> <!-- Fim do cartão -->
</div> <!-- Fim da tela bloqueio -->

<!-- CONTEÚDO DO RELATÓRIO -->
<div class="container mt-3" id="conteudoRelatorio" style="display:none; max-width:900px"> <!-- AUMENTEI PARA 900px PARA CABER CULTO -->
<div class="card shadow p-3"> <!-- Cartão do relatório -->
<h4 class="text-center">Relatório Financeiro</h4> <!-- Título do relatório -->

<div class="d-flex gap-2 mt-3 mb-3 flex-wrap"> <!-- Linha de controles -->
  <select id="mesSelect" class="form-select" style="max-width:180px" onchange="carregar(this.value)"></select>
  <button class="btn btn-outline-primary" onclick="carregar()">🔄</button>
  <button class="btn btn-success" onclick="baixarExcel()">📥 Excel</button>
  <button class="btn btn-warning" onclick="sair()">Sair</button>
  <a href="index.html" class="btn btn-secondary ms-auto" onclick="sessionStorage.clear()">Voltar</a> <!-- CORRIGI CAMINHO PARA index.html -->
</div>

<div id="resumo" class="alert alert-info"></div>
<div id="lista" class="table-responsive"></div> <!-- ADICIONEI table-responsive PARA NÃO QUEBRAR NO CELULAR -->

</div>
</div>

<script>
const SENHA_CORRETA = "24M@ri28Juli";
let dadosAtuais = [];
let mesAtualGlobal = "";

function checarSenha(){
  if(document.getElementById('inputSenha').value === SENHA_CORRETA){
    sessionStorage.setItem('logado','true');
    document.getElementById('telaBloqueio').style.display='none';
    document.getElementById('conteudoRelatorio').style.display='block';
    carregar();
  } else {
    document.getElementById('erroSenha').textContent='❌ Senha incorreta!';
  }
}
function voltar(){ sessionStorage.clear(); window.location.href='index.html'; }
function sair(){ sessionStorage.clear(); document.getElementById('inputSenha').value=''; document.getElementById('conteudoRelatorio').style.display='none'; document.getElementById('telaBloqueio').style.display='flex'; document.getElementById('erroSenha').textContent=''; }

async function carregar(mesForcado) {
  let select = document.getElementById('mesSelect');
  let mes = mesForcado || select.value;
  let url = mes ? `/.netlify/functions/listar?mes=${mes}` : `/.netlify/functions/listar`;
  document.getElementById('lista').innerHTML = '<p class="text-center">Carregando...</p>';
  try {
    let r = await fetch(url);
    let { dados, meses, mesAtual } = await r.json();
    dadosAtuais = dados;
    mesAtualGlobal = mes || mesAtual;

    if (select.options.length === 0 || meses.length !== select.options.length) {
        select.innerHTML = '';
        if (meses.length === 0) meses = [mesAtual];
        meses.sort().reverse().forEach(m => {
            let opt = document.createElement('option');
            opt.value = m;
            let [a, me] = m.split('-');
            opt.textContent = me + '/' + a;
            if (m === (mes || mesAtual)) opt.selected = true;
            select.appendChild(opt);
        });
        if (!mes) mes = mesAtual;
        mesAtualGlobal = mes;
    }

    let total = dados.reduce((s, x) => s + (Number(x.valor)||0), 0);
    let dizimo = dados.filter(x=>x.tipo==='Dízimo').reduce((s,x)=>s+Number(x.valor),0);
    let oferta = dados.filter(x=>x.tipo==='Oferta').reduce((s,x)=>s+Number(x.valor),0);
    let missoes = dados.filter(x=>x.tipo==='Missões').reduce((s,x)=>s+Number(x.valor),0);

    document.getElementById('resumo').innerHTML = `<b>Mês: ${mes}</b> | Lançamentos: ${dados.length}<br><b>Total: R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}</b> | Dízimos: R$ ${dizimo.toLocaleString('pt-BR')} | Ofertas: R$ ${oferta.toLocaleString('pt-BR')} | Missões: R$ ${missoes.toLocaleString('pt-BR')}`;

    if (dados.length === 0) { document.getElementById('lista').innerHTML = '<p class="text-center text-muted mt-3">Nenhum lançamento neste mês</p>'; return; }

    // CORREÇÃO: ADICIONEI CULTO E PAGAMENTO NA TABELA
    let html = '<table class="table table-sm table-striped"><tr><th>Data</th><th>Nome</th><th>Tipo</th><th>Valor</th><th>Pagamento</th><th>Culto</th></tr>';
    dados.forEach(d => {
        html += `<tr>
          <td>${(d.data||'').split('-').reverse().join('/')}</td>
          <td>${d.nome||''}</td>
          <td>${d.tipo||''}</td>
          <td>R$ ${d.valorFormatado || Number(d.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td>
          <td>${d.pagamento||''}</td>
          <td><span class="badge bg-primary">${d.culto||''}</span></td>
        </tr>`;
    });
    html += '</table>';
    document.getElementById('lista').innerHTML = html;

  } catch(e) { document.getElementById('lista').innerHTML = '<p class="text-danger text-center">Erro ao carregar.</p>'; }
}

function baixarExcel(){
  if(dadosAtuais.length===0){ alert('Nenhum dado para exportar'); return; }
  let csv = "Data;Nome;Tipo;Valor;Pagamento;Culto;Observacao\n";
  dadosAtuais.forEach(d=>{
    csv += `${d.data||''};${d.nome||''};${d.tipo||''};${d.valorFormatado||d.valor||''};${d.pagamento||''};${d.culto||''};${(d.observacao||'').replace(/;/g,',')}\n`;
  });
  let blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `IBJI-${mesAtualGlobal}.csv`;
  a.click();
}

sessionStorage.clear();
document.getElementById('conteudoRelatorio').style.display='none';
document.getElementById('telaBloqueio').style.display='flex';
</script>
</body>
</html>
