<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório - Tesouraria</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
 body{background:#f1f5f9}
 #telaBloqueio{position:fixed;top:0;left:0;width:100%;height:100%;background:#f1f5f9;z-index:9999;display:flex;justify-content:center;align-items:center;padding:20px}
</style>
</head>
<body style="background:#f1f5f9">

<div id="telaBloqueio">
<div class="card shadow p-4" style="max-width:400px;width:100%">
<h4 class="text-center">🔒 Acesso Restrito</h4>
<p class="text-center text-muted">Tesouraria IBJI</p>
<label>Digite a senha</label>
<input type="password" id="inputSenha" class="form-control mb-3" placeholder="Senha" onkeydown="if(event.key==='Enter') checarSenha()">
<button class="btn btn-primary w-100" onclick="checarSenha()">Entrar</button>
<p id="erroSenha" class="text-danger text-center mt-2"></p>
<button class="btn btn-outline-secondary w-100 mt-2" onclick="voltar()">Voltar para Lançamento</button>
</div>
</div>

<div class="container mt-3" id="conteudoRelatorio" style="display:none; max-width:700px">
<div class="card shadow p-3">
<h4 class="text-center">Relatório Financeiro</h4>

<div class="d-flex gap-2 mt-3 mb-3">
  <select id="mesSelect" class="form-select" style="max-width:180px" onchange="carregar(this.value)"></select>
  <button class="btn btn-outline-primary" onclick="carregar()">🔄</button>
  <button class="btn btn-success" onclick="baixarExcel()">📥 Excel</button>
  <button class="btn btn-warning" onclick="sair()">Sair</button>
  <a href="../index.html" class="btn btn-secondary ms-auto" onclick="sessionStorage.clear()">Voltar</a>
</div>

<div id="resumo" class="alert alert-info"></div>
<div id="lista"></div>

</div>
</div>

<script>
const SENHA_CORRETA = "24M@ri28Juli";
let dadosAtuais = [];
let mesAtualGlobal = "";

function checarSenha(){
  if(document.getElementById('inputSenha').value === SENHA_CORRETA){
    sessionStorage.setItem('logado','true');
    document.getElementById('telaBloqueio').style.display='none';
    document.getElementById('conteudoRelatorio').style.display='block';
    carregar();
  } else {
    document.getElementById('erroSenha').textContent='❌ Senha incorreta!';
  }
}
function voltar(){ sessionStorage.clear(); window.location.href='../index.html'; }
function sair(){ sessionStorage.clear(); document.getElementById('inputSenha').value=''; document.getElementById('conteudoRelatorio').style.display='none'; document.getElementById('telaBloqueio').style.display='flex'; document.getElementById('erroSenha').textContent=''; }

async function carregar(mesForcado) {
  let select = document.getElementById('mesSelect');
  let mes = mesForcado || select.value;
  let url = mes ? `/.netlify/functions/listar?mes=${mes}` : `/.netlify/functions/listar`;
  document.getElementById('lista').innerHTML = '<p class="text-center">Carregando...</p>';
  try {
    let r = await fetch(url);
    let { dados, meses, mesAtual } = await r.json();
    dadosAtuais = dados;
    mesAtualGlobal = mes || mesAtual;

    if (select.options.length === 0 || meses.length !== select.options.length) {
        select.innerHTML = '';
        if (meses.length === 0) meses = [mesAtual];
        meses.sort().reverse().forEach(m => {
            let opt = document.createElement('option');
            opt.value = m;
            let [a, me] = m.split('-');
            opt.textContent = me + '/' + a;
            if (m === (mes || mesAtual)) opt.selected = true;
            select.appendChild(opt);
        });
        if (!mes) mes = mesAtual;
        mesAtualGlobal = mes;
    }

    let total = dados.reduce((s, x) => s + (Number(x.valor)||0), 0);
    let dizimo = dados.filter(x=>x.tipo==='Dízimo').reduce((s,x)=>s+Number(x.valor),0);
    let oferta = dados.filter(x=>x.tipo==='Oferta').reduce((s,x)=>s+Number(x.valor),0);

    document.getElementById('resumo').innerHTML = `<b>Mês: ${mes}</b> | Lançamentos: ${dados.length}<br><b>Total: R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}</b> | Dízimos: R$ ${dizimo.toLocaleString('pt-BR')} | Ofertas: R$ ${oferta.toLocaleString('pt-BR')}`;

    if (dados.length === 0) { document.getElementById('lista').innerHTML = '<p class="text-center text-muted mt-3">Nenhum lançamento neste mês</p>'; return; }

    let html = '<table class="table table-sm table-striped"><tr><th>Data</th><th>Nome</th><th>Tipo</th><th>Valor</th></tr>';
    dados.forEach(d => {
        html += `<tr><td>${(d.data||'').split('-').reverse().join('/')}</td><td>${d.nome||''}</td><td>${d.tipo||''}</td><td>R$ ${d.valorFormatado || Number(d.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td></tr>`;
    });
    html += '</table>';
    document.getElementById('lista').innerHTML = html;

  } catch(e) { document.getElementById('lista').innerHTML = '<p class="text-danger text-center">Erro ao carregar.</p>'; }
}

function baixarExcel(){
  if(dadosAtuais.length===0){ alert('Nenhum dado para exportar'); return; }
  let csv = "Data;Nome;Tipo;Valor;Pagamento;Culto;Observacao\n";
  dadosAtuais.forEach(d=>{
    csv += `${d.data||''};${d.nome||''};${d.tipo||''};${d.valorFormatado||d.valor||''};${d.pagamento||''};${d.culto||''};${(d.observacao||'').replace(/;/g,',')}\n`;
  });
  let blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `IBJI-${mesAtualGlobal}.csv`;
  a.click();
}

sessionStorage.clear();
document.getElementById('conteudoRelatorio').style.display='none';
document.getElementById('telaBloqueio').style.display='flex';
</script>
</body>
</html>
