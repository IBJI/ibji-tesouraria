<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório - Tesouraria</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f1f5f9">
<div class="container mt-3" style="max-width:700px">
<div class="card shadow p-3">
<h4 class="text-center">Relatório Financeiro</h4>

<div class="d-flex gap-2 mt-3 mb-3">
  <select id="mesSelect" class="form-select" style="max-width:180px" onchange="carregar(this.value)"></select>
  <button class="btn btn-outline-primary" onclick="carregar()">🔄 Atualizar</button>
  <a href="index.html" class="btn btn-secondary ms-auto">Voltar</a>
</div>

<div id="resumo" class="alert alert-info"></div>
<div id="lista"></div>

</div>
</div>

<script>
async function carregar(mesForcado) {
  let select = document.getElementById('mesSelect');
  let mes = mesForcado || select.value;
  let url = mes ? `/.netlify/functions/listar?mes=${mes}` : `/.netlify/functions/listar`;
  
  document.getElementById('lista').innerHTML = '<p class="text-center">Carregando...</p>';
  
  try {
    let r = await fetch(url);
    let { dados, meses, mesAtual } = await r.json();
    
    // Preenche seletor
    if (select.options.length === 0 || meses.length !== select.options.length) {
        select.innerHTML = '';
        if (meses.length === 0) meses = [mesAtual];
        meses.sort().reverse().forEach(m => {
            let opt = document.createElement('option');
            opt.value = m;
            let [a, me] = m.split('-');
            opt.textContent = me + '/' + a;
            if (m === (mes || mesAtual)) opt.selected = true;
            select.appendChild(opt);
        });
        if (!mes) mes = mesAtual;
    }

    // Calcula totais
    let total = dados.reduce((s, x) => s + (Number(x.valor)||0), 0);
    let dizimo = dados.filter(x=>x.tipo==='Dízimo').reduce((s,x)=>s+Number(x.valor),0);
    let oferta = dados.filter(x=>x.tipo==='Oferta').reduce((s,x)=>s+Number(x.valor),0);

    document.getElementById('resumo').innerHTML = `
      <b>Mês: ${mes}</b> | Lançamentos: ${dados.length}<br>
      <b>Total: R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}</b> | Dízimos: R$ ${dizimo.toLocaleString('pt-BR')} | Ofertas: R$ ${oferta.toLocaleString('pt-BR')}
    `;

    if (dados.length === 0) {
        document.getElementById('lista').innerHTML = '<p class="text-center text-muted mt-3">Nenhum lançamento neste mês</p>';
        return;
    }

    let html = '<table class="table table-sm table-striped"><tr><th>Data</th><th>Nome</th><th>Tipo</th><th>Valor</th></tr>';
    dados.forEach(d => {
        html += `<tr>
          <td>${(d.data||'').split('-').reverse().join('/')}</td>
          <td>${d.nome||''}</td>
          <td>${d.tipo||''}</td>
          <td>R$ ${d.valorFormatado || Number(d.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td>
        </tr>`;
    });
    html += '</table>';
    document.getElementById('lista').innerHTML = html;

  } catch(e) {
    document.getElementById('lista').innerHTML = '<p class="text-danger text-center">Erro ao carregar. Verifique se o arquivo listar.js já foi atualizado.</p>';
  }
}
carregar();
</script>
</body>
</html>
