<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Relatório</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script></head>
<body style="background:#f1f5f9"><div class="container mt-3" style="max-width:850px">
<div id="login" class="card shadow p-4 mx-auto text-center" style="max-width:400px;margin-top:40px"><h4>🔒 Tesouraria</h4><input type="password" id="senha" class="form-control mt-3" placeholder="senha"><button class="btn btn-dark w-100 mt-2" onclick="entrar()">Entrar</button><p id="erro" class="text-danger mt-2" style="display:none">Senha errada!</p></div>
<div id="conteudo" style="display:none"><div class="card shadow p-4"><div class="d-flex justify-content-between"><h4 class="text-center">🙏 Relatório - Dízimos e Ofertas</h4><button class="btn btn-outline-danger btn-sm" onclick="sair()">Sair 🔒</button></div><div class="d-flex gap-2 mb-2 mt-3"><input id="busca" class="form-control" placeholder="Pesquisar no canto direito..." oninput="filtrar()"><button class="btn btn-success btn-sm" onclick="exportarExcel()">📊 Excel</button></div><div class="alert alert-light"><b>Total: R$ <span id="totalGeral">0,00</span></b> | Dízimos: R$ <span id="totalDizimo">0,00</span> | Ofertas: R$ <span id="totalOferta">0,00</span></div><div class="table-responsive"><table class="table table-bordered table-sm"><thead><tr><th>Data</th><th>Nome</th><th>Tipo</th><th>Valor</th><th>Pagto</th><th>Culto</th><th>Obs</th></tr></thead><tbody id="lista"></tbody></table></div><a href="index.html" class="btn btn-outline-secondary">← Voltar</a></div></div></div>
<script>
const SENHA='24M@ri28Juli'; let dadosGlobais=[]; let dadosFiltrados=[];
function entrar(){if(document.getElementById('senha').value===SENHA){sessionStorage.setItem('ok','1'); mostrar();}else document.getElementById('erro').style.display='block';}
function sair(){sessionStorage.removeItem('ok');document.getElementById('conteudo').style.display='none';document.getElementById('login').style.display='block';document.getElementById('senha').value='';document.getElementById('erro').style.display='none';}
async function mostrar(){document.getElementById('login').style.display='none'; document.getElementById('conteudo').style.display='block';let r=await fetch('/.netlify/functions/listar'); let lista=await r.json(); dadosGlobais=lista; dadosFiltrados=lista; render(lista);}
function render(lista){let total=0,dizimo=0,oferta=0,html=''; lista.slice().reverse().forEach(e=>{let v=Number(e.valor||0); total+=v; if((e.tipo||'').toLowerCase().includes('dízimo')||(e.tipo||'').toLowerCase().includes('dizimo')) dizimo+=v; else oferta+=v; html+=`<tr><td>${e.data||''}</td><td>${e.nome||''}</td><td>${e.tipo||''}</td><td>R$ ${e.valorFormatado||v.toLocaleString('pt-BR',{minimumFractionDigits:2})}</td><td>${e.pagamento||''}</td><td>${e.culto||''}</td><td>${e.observacao||''}</td></tr>`;}); document.getElementById('totalGeral').textContent=total.toLocaleString('pt-BR',{minimumFractionDigits:2}); document.getElementById('totalDizimo').textContent=dizimo.toLocaleString('pt-BR',{minimumFractionDigits:2}); document.getElementById('totalOferta').textContent=oferta.toLocaleString('pt-BR',{minimumFractionDigits:2}); document.getElementById('lista').innerHTML=html||'<tr><td colspan=7 style=text-align:center>Nenhum dado na nuvem</td></tr>';}
function filtrar(){let termo=document.getElementById('busca').value.toLowerCase(); let f=dadosGlobais.filter(e=>(e.nome||'').toLowerCase().includes(termo)||(e.tipo||'').toLowerCase().includes(termo)); dadosFiltrados=f; render(f);}
function exportarExcel(){let d=[["Data","Nome","Tipo","Valor","Pagamento","Culto","Observacao"]]; (dadosFiltrados.length?dadosFiltrados:dadosGlobais).forEach(e=>d.push([e.data,e.nome,e.tipo,e.valorFormatado||e.valor,e.pagamento,e.culto,e.observacao])); let wb=XLSX.utils.book_new(); let ws=XLSX.utils.aoa_to_sheet(d); XLSX.utils.book_append_sheet(wb,ws,"Tesouraria"); XLSX.writeFile(wb,"tesouraria_ibji.xlsx");}
window.addEventListener('pagehide',()=>{sessionStorage.removeItem('ok');}); window.addEventListener('beforeunload',()=>{sessionStorage.removeItem('ok');});
</script></body></html>
