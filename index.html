<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dízimos e Ofertas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><style>.logo{width:90px;display:block;margin:0 auto 8px}</style></head>
<body style="background:#f1f5f9"><div class="container mt-4" style="max-width:520px"><div class="card shadow p-4"><img src="logo.png" class="logo" alt="" onerror="this.style.display='none'"><h3 class="text-center">Igreja Batista no<br>Jardim dos Ipes</h3><h4 class="text-center mt-3">🙏 Dízimos e Ofertas</h4>
<label>Data</label><input type="date" id="data" class="form-control mb-2">
<label>Nome (max 20 letras)</label><input type="text" id="nome" maxlength="20" class="form-control mb-2" placeholder="EX: JOAO SILVA">
<div class="row"><div class="col-6"><label>Tipo</label><select id="tipo" class="form-select mb-2"><option>Dízimo</option><option>Oferta</option><option>Missões</option></select></div><div class="col-6"><label>Valor R$</label><input type="text" inputmode="numeric" id="valor" class="form-control mb-2" placeholder="0,00" oninput="formataValor(this)"></div></div>
<div class="row"><div class="col-6"><label>Pagamento</label><select id="pagamento" class="form-select mb-2"><option>Pix</option><option>Gazofilácio</option><option>Transferência</option></select></div><div class="col-6"><label>Culto</label><select id="culto" class="form-select mb-2"><option>Domingo</option><option>Sábado</option></select></div></div>
<label>Observação</label><textarea id="observacao" class="form-control mb-3" rows="2" placeholder="EXEMPLO"></textarea>
<button class="btn btn-primary w-100 btn-lg" id="btnSalvar" onclick="salvar()">Registrar Entrada</button>
<p id="msg" class="text-center mt-2 fw-bold"></p><a href="admin.html" class="btn btn-outline-secondary w-100 mt-2">Ver Relatório</a></div></div></div>
<script>
// === BLOQUEIO DE DATA FUTURA ===
const hojeISO = new Date().toISOString().split('T')[0];
const inputData = document.getElementById('data');
inputData.max = hojeISO;
inputData.value = hojeISO;
inputData.addEventListener('change', function(){
  if(this.value > hojeISO){
    alert('❌ Não pode lançar com data futura!');
    this.value = hojeISO;
  }
});

document.getElementById('nome').addEventListener('input',function(){this.value=this.value.replace(/[^a-zA-ZÀ-ÿ\s]/g,'').toUpperCase().slice(0,20)});
document.getElementById('observacao').addEventListener('input',function(){this.value=this.value.replace(/[^a-zA-ZÀ-ÿ\s]/g,'').toUpperCase()});

function formataValor(input) {
  let v = input.value.replace(/\D/g, '');
  if (v === '') { input.value = ''; return; }
  if (v.length > 12) v = v.slice(0, 12);
  let num = (parseInt(v) / 100).toFixed(2).split('.');
  let inteiro = num[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  input.value = inteiro + ',' + num[1];
}
function pegaValorNumerico() {
  let v = document.getElementById('valor').value;
  if (!v) return 0;
  return parseFloat(v.replace(/\./g, '').replace(',', '.'));
}

async function salvar(){
 let dataVal = document.getElementById('data').value;
 if(dataVal > hojeISO){
   alert('❌ Data futura não permitida! Selecione hoje ou data anterior.');
   document.getElementById('data').value = hojeISO;
   return;
 }
 let b=document.getElementById('btnSalvar'); b.disabled=true; b.textContent='Salvando...';
 let valorNum = pegaValorNumerico();
 let valorFormat = document.getElementById('valor').value;
 let d={
   data:dataVal,
   nome:document.getElementById('nome').value.trim(),
   tipo:document.getElementById('tipo').value,
   valor:valorNum,
   valorFormatado:valorFormat,
   pagamento:document.getElementById('pagamento').value,
   culto:document.getElementById('culto').value,
   observacao:document.getElementById('observacao').value
 };
 if(!d.nome||!d.valor){alert('Preencha nome e valor'); b.disabled=false; b.textContent='Registrar Entrada'; return;}
 try{
   let r=await fetch('/.netlify/functions/salvar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}); 
   if(!r.ok) throw Error(); 
   document.getElementById('msg').className='text-center mt-2 fw-bold text-success';
   document.getElementById('msg').textContent='✅ Salvo na nuvem! R$ ' + valorFormat; 
   document.getElementById('nome').value=''; 
   document.getElementById('valor').value=''; 
   document.getElementById('observacao').value='';
   setTimeout(()=>{document.getElementById('msg').textContent=''},3000);
 }catch(e){
   document.getElementById('msg').className='text-center mt-2 fw-bold text-danger';
   document.getElementById('msg').textContent='❌ Erro ao salvar na nuvem';
 }
 b.disabled=false; b.textContent='Registrar Entrada';
}
</script></body></html>
